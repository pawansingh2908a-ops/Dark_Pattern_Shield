<!doctype html>
<html>
<head><meta charset="utf-8"><link rel="stylesheet" href="popup.css"></head>
<body>
  <header>
    <h1>🛡 Dark Pattern Shield</h1>
    <span id="risk" class="badge">–</span>
  </header>
  <div class="actions">
    <button id="scan">Scan this page</button>
  </div>
  <div class="opts">
    <label><input type="checkbox" id="highlight"> Highlight on page</label>
    <label><input type="checkbox" id="autoScan"> Auto-scan pages</label>
  </div>
  <div id="msg" class="msg"></div>
  <div id="results"></div>
  <footer>Analysis runs locally in your browser. Heuristic results can include false positives.</footer>
  <script src="popup.js"></script>
</body>
</html>
